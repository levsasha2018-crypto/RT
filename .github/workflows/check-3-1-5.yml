name: 3.1.5 Исследование RC-цепи

# Requires real capture files. Source-only preparation does not submit model data.
on:
  push:
    paths:
      - '311-adc/rc.csv'
      - '311-adc/rc.png'
      - '311-adc/rc.log'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-3-1-5.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
