name: 3.2.5 Запись испытательного сигнала

# Runs when genuine capture files are added or updated.
on:
  push:
    paths:
      - '321-audio-recorder/melody.wav'
      - '321-audio-recorder/melody.log'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-3-2-5.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
