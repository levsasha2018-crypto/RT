name: 3.2.7 Запись звука

# Runs when genuine capture files are added or updated.
on:
  push:
    paths:
      - '321-audio-recorder/device-3-2-7.log'
      - '321-audio-recorder/recording.wav'
      - '321-audio-recorder/recording.log'
  workflow_dispatch:

# Пока идёт отладка, пушей подряд бывает много: в работе остаётся последний,
# предыдущие прогоны той же проверки отменяются.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: ant-lab-ru/es-test/.github/workflows/check-3-2-7.yml@master
    secrets:
      ES_ACCOUNT_SECRET: ${{ secrets.ES_ACCOUNT_SECRET }}
